name: Nightly Quality

# ENGINEERING-21 (§10) — mutation testing (StrykerJS) is slow, so it runs nightly (and on-demand),
# NEVER in the per-PR ci.yml pipeline. It measures the suite's assertion strength on the critical
# pure-logic scope and gates against mutation-baseline.json.
on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC nightly
  workflow_dispatch: {} # manual trigger

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation Testing (Stryker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run Stryker (critical scope)
        run: npm run test:mutation
      - name: Check score regression against baseline
        run: node scripts/check-mutation-score.js
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ github.run_number }}
          path: reports/mutation/
          retention-days: 30
          if-no-files-found: warn

  # ENGINEERING-30 — SQL mutation probes. Injects 10 high-risk mutations into the migration SQL one
  # at a time (temporarily; always restored), applies a fresh DB, and runs pgTAP. A mutation pgTAP
  # still passes = a hole in the SQL suite (SURVIVED = job fails). Needs Docker (own job).
  sql-mutation:
    name: SQL Mutation Probes (ENGINEERING-30)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Start Supabase (Docker)
        run: npx --no-install supabase start
      - name: Reset DB (clean baseline)
        run: npx --no-install supabase db reset --local
      - name: Run SQL mutation probes
        run: bash scripts/sql-mutation-probe.sh
      - name: Upload mutation probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-mutation-report-${{ github.run_number }}
          path: reports/sql-mutation/
          retention-days: 30
          if-no-files-found: warn
      - name: Stop Supabase
        if: always()
        run: npx --no-install supabase stop
