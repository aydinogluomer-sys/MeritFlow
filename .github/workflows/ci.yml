name: CI

# ENGINEERING-01a — full blocking CI pipeline.
#   lint ∥ typecheck ∥ unit  →  db (pgTAP)  ∥  build  →  e2e (Playwright)
# Job ids are the status-check names. Branch protection / required-checks are configured
# in the GitHub UI (ops step); this workflow only DEFINES the jobs. The real "green" proof
# is the first push actually running these — GitHub Actions cannot be run locally.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One in-flight run per ref; new pushes cancel the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast static gates — independent, run in parallel ────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Circular dependency check (madge — ENGINEERING-02A boundary)
        run: npx --no-install madge --circular --ts-config tsconfig.json --extensions ts,tsx src/

  unit:
    runs-on: ubuntu-latest
    env:
      # Dummy public env so modules that read env at import (src/lib/env.ts) load; no secrets.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test

  # ── AppSec gate (ENGINEERING-19 8.1): dependency audit (high+ → fail) + exception-expiry check.
  #    Independent — runs in parallel with lint/typecheck/unit (no `needs`). ──
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Dependency audit (critical + high → fail)
        run: npm audit --audit-level=high
      - name: Check no dependency exceptions have expired
        run: bash scripts/check-dependency-exceptions.sh

  # ── Migration safety lint — static (naming/ordering/destructive/index); no Docker ──
  migration-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Migration naming, ordering, destructive-op and index-safety check
        run: bash scripts/check-migrations.sh supabase/migrations
      # ENGINEERING-22 (§11): static DB-surface manifest audit — every migration table/view/
      # SECURITY DEFINER function must be classified in security/db-surface.yml (no Docker).
      - name: DB surface manifest audit (ENGINEERING-22)
        run: bash scripts/audit-db-surface.sh supabase/migrations security/db-surface.yml security/security-definer-allowlist.txt
      # False-green proof: the audit MUST flag an injected phantom table. The selftest owns its exit
      # code (0 on pass), so no `|| true` — a real regression here fails the job.
      - name: DB surface manifest selftest (false-green proof)
        run: DB_SURFACE_AUDIT_SELFTEST=1 bash scripts/audit-db-surface.sh supabase/migrations security/db-surface.yml security/security-definer-allowlist.txt

  # ── Database: apply every migration from scratch + run pgTAP (Supabase via Docker) ──
  db:
    needs: [migration-lint, lint, typecheck, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Start Supabase (Docker)
        run: npx --no-install supabase start
      - name: Reset DB — apply all migrations + seed (retry transient infra failures)
        run: |
          for attempt in 1 2 3; do
            echo "::group::db reset attempt $attempt"
            if npx --no-install supabase db reset; then
              echo "::endgroup::"; echo "db reset OK on attempt $attempt"; exit 0
            fi
            echo "::endgroup::"
            echo "db reset failed on attempt $attempt — recycling Supabase before retry"
            npx --no-install supabase stop || true
            npx --no-install supabase start
            sleep 5
          done
          echo "db reset failed after 3 attempts"; exit 1
      - name: Schema drift check (supabase db diff — uncommitted schema changes fail)
        run: |
          DRIFT=$(npx --no-install supabase db diff 2>/dev/null || true)
          CLEAN=$(echo "$DRIFT" | tr -d '[:space:]')
          if [ -n "$CLEAN" ]; then
            echo "::error::Schema drift detected — schema changes exist that are not captured in a migration file:"
            echo "$DRIFT"
            exit 1
          fi
          echo "Schema drift check: OK (no uncommitted changes)"
      - name: Run pgTAP suite
        run: npx --no-install supabase test db
      - name: SECURITY DEFINER catalog audit (ENGINEERING-19 8.6)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/audit-security-definer.sh
      - name: Stop Supabase
        if: always()
        run: npx --no-install supabase stop

  # ── Concurrency harness (ENGINEERING-16): real multi-session pg.Client races against a booted
  #    Supabase, proving the DB-level uniqueness guards prevent double-effects under concurrency.
  #    Runs AFTER db (migrations + pgTAP must pass first). Mirrors perf-smoke's boot/reset shape. ──
  concurrency-db:
    needs: [db]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Start Supabase (Docker)
        run: npx --no-install supabase start
      - name: Reset DB — apply all migrations + seed (retry transient infra failures)
        run: |
          for attempt in 1 2 3; do
            echo "::group::db reset attempt $attempt"
            if npx --no-install supabase db reset; then
              echo "::endgroup::"; echo "db reset OK on attempt $attempt"; exit 0
            fi
            echo "::endgroup::"
            npx --no-install supabase stop || true
            npx --no-install supabase start
            sleep 5
          done
          echo "db reset failed after 3 attempts"; exit 1
      - name: Concurrency harness (ENGINEERING-16)
        env:
          TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npm run test:concurrency
      - name: Stop Supabase
        if: always()
        run: npx --no-install supabase stop

  # ── Perf smoke (ICP): seed the expected profile + EXPLAIN the hot queries; fail on a
  #    selective-query seq-scan-on-large-table regression. 3x/10x run locally (docs/runbooks/
  #    performance.md), not in CI. Not a required check until the budgets are tuned. ──
  perf-smoke:
    needs: [migration-lint, lint, typecheck, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Start Supabase (Docker)
        run: npx --no-install supabase start
      - name: Reset DB — apply all migrations + seed (retry transient infra failures)
        run: |
          for attempt in 1 2 3; do
            echo "::group::db reset attempt $attempt"
            if npx --no-install supabase db reset; then
              echo "::endgroup::"; echo "db reset OK on attempt $attempt"; exit 0
            fi
            echo "::endgroup::"
            echo "db reset failed on attempt $attempt — recycling Supabase before retry"
            npx --no-install supabase stop || true
            npx --no-install supabase start
            sleep 5
          done
          echo "db reset failed after 3 attempts"; exit 1
      - name: Perf parser self-test (ENGINEERING-13 false-green guard)
        run: bash scripts/perf-selftest.sh
      - name: Perf benchmark (expected ICP profile)
        run: bash scripts/perf-benchmark.sh expected
      - name: Stop Supabase
        if: always()
        run: npx --no-install supabase stop

  # ── N-1 → N migration upgrade proof (ENGINEERING-20 §9B): prove representative N-1 data survives
  #    the latest migration. The drill reaches the N-1 baseline (stash N + `supabase db reset`),
  #    loads the fixture, applies ONLY N on top, then checks data-agnostic financial invariants.
  #    Does NOT `supabase db reset` to apply N — N lands on top of pre-existing data (the real
  #    upgrade path). Runs in parallel with `db` / `perf-smoke` (all depend on the fast gates). ──
  n1-upgrade:
    needs: [migration-lint, lint, typecheck, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Start Supabase (Docker)
        run: npx --no-install supabase start
      - name: N-1 → N upgrade drill
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/n1-upgrade-drill.sh
      - name: Stop Supabase
        if: always()
        run: npx --no-install supabase stop

  # ── Production build — dummy public env; no live Supabase needed at build time ──
  build:
    needs: [lint, typecheck, unit]
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generate SBOM (CycloneDX)
        run: npm run sbom
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cdx
          path: artifacts/sbom.cdx.json
          retention-days: 90
          if-no-files-found: error

  # ── End-to-end (Playwright). The playwright.config webServer auto-starts `npm run dev`,
  #    so this job only needs a booted, seeded Supabase + the local keys in the app env.
  #    ENGINEERING-11: BLOCKING. The `setup` project signs in the seeded users (password
  #    grant → storageState); the authenticated-hr / authenticated-emp projects run the
  #    read-path + negative-authz smoke, and `chromium` runs the unauthenticated guards.
  #    `continue-on-error` is removed — the e2e job is now a real gate. Add `e2e` to the
  #    required status checks (alongside lint / typecheck / unit / migration-lint / db / build).
  e2e:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browser (chromium)
        run: npx --no-install playwright install --with-deps chromium
      - name: Start Supabase (Docker)
        run: npx --no-install supabase start
      - name: Reset DB — apply all migrations + seed (retry transient infra failures)
        run: |
          for attempt in 1 2 3; do
            echo "::group::db reset attempt $attempt"
            if npx --no-install supabase db reset; then
              echo "::endgroup::"; echo "db reset OK on attempt $attempt"; exit 0
            fi
            echo "::endgroup::"
            echo "db reset failed on attempt $attempt — recycling Supabase before retry"
            npx --no-install supabase stop || true
            npx --no-install supabase start
            sleep 5
          done
          echo "db reset failed after 3 attempts"; exit 1
      - name: Export local Supabase keys into the app env
        run: |
          npx --no-install supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          # shellcheck disable=SC1090
          source "$RUNNER_TEMP/supabase.env"
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Build app (production — pre-compiled routes for stable E2E)
        run: npm run build
      # Split into per-project steps so a failure is pinpointed from the step conclusions
      # alone (job logs need repo-admin auth). `if: always()` runs every step regardless of an
      # earlier failure; the job still fails if any step fails. The production server is started
      # by the playwright webServer (`next start`).
      - name: E2E — unauthenticated guards (chromium)
        run: npm run test:e2e -- --project=chromium
      - name: E2E — auth setup (password sign-in → storageState)
        if: always()
        run: npm run test:e2e -- --project=setup
      - name: E2E — authenticated read-path + negative-authz (hr, emp)
        if: always()
        run: npm run test:e2e -- --project=authenticated-hr --project=authenticated-emp --no-deps
      # ENGINEERING-17 — golden-path mutation chains (multi-actor). `--no-deps` because the setup
      # step above already produced all storageState fixtures (hr/emp/mgr/finance/emp-b).
      - name: E2E — golden A (full normal payout chain)
        if: always()
        run: npm run test:e2e -- --project=golden --grep "Golden A" --no-deps
      - name: E2E — golden B (dispute chain)
        if: always()
        run: npm run test:e2e -- --project=golden --grep "Golden B" --no-deps
      - name: E2E — golden C (security + IDOR)
        if: always()
        run: npm run test:e2e -- --project=golden --grep "Golden C" --no-deps
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop Supabase
        if: always()
        run: npx --no-install supabase stop
