# ENGINEERING-08 — AppSec scanning (separate from ci.yml to keep concerns clean).
#   secret-scan       gitleaks over the working tree — BLOCKING (no secret may be committed).
#   dependency-audit  npm audit (high+) — BLOCKING. The pre-existing backlog was cleared
#                     in commit 7e3841f, so a new high/critical advisory now fails the
#                     pipeline (see docs/runbooks/appsec.md "Dependency audit rollout").
name: Security

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gitleaks
        run: |
          GL_VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Secret scan (working tree; blocking)
        run: gitleaks detect --source . --config .gitleaks.toml --no-git --redact --verbose

  dependency-audit:
    runs-on: ubuntu-latest
    # BLOCKING: the pre-existing high/critical backlog was cleared in commit 7e3841f, so this
    # job now gates the pipeline — a new high+ advisory fails the Security workflow.
    # See the "Dependency audit rollout" note in docs/runbooks/appsec.md.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: npm audit (high and above — blocking)
        run: npm audit --audit-level=high
