# ENGINEERING-08 — gitleaks config. Extends the default rule set and allowlists known-safe,
# non-secret CI/dev placeholders. No real secret is ever committed: the service-role key lives
# only in env, and the local Supabase keys are generated by `supabase start` (never committed).
[extend]
useDefault = true

[allowlist]
description = "Non-secret CI dummies, env examples, and deterministic test/seed fixtures"
regexes = [
  '''ci-anon-key''',
  '''ci-service-role-key''',
]
paths = [
  '''\.env\.example''',
  '''supabase/seed/.*''',
]
