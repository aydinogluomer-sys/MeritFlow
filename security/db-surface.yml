# =============================================================================
# ENGINEERING-22 (§11) — DB surface manifest. Every public table / view / SECURITY DEFINER
# function is classified here. scripts/audit-db-surface.sh (migration-lint CI job) fails if the
# migrations expose any surface item NOT recorded below — so new surface must be classified before
# it can merge. This is a design/audit record, NOT a policy checker (RLS correctness lives in the
# migrations + pgTAP; intended read/write access is documented in security/access-matrix.yml).
#
# financial_class enum:
#   compensation_sensitive  comp records (HR/Finance gated, comp audit — AD3/D2)
#   financial               bonus_*, point_ledger, exports, v_finance_*
#   catalog                 roles/permissions/role_permissions, scoring_policy*
#   operational             tasks/task_reviews, memberships, teams/team_*, disputes, notifications,
#                           invitations, profiles, organizations, organization_settings, anti_gaming_flags
#   audit_log               audit_logs, task_events, dispute_events (append-only trails)
#   admin                   outbox_events, command_log, rate_limit_counters, support_access_grants
#
# grants: authenticated privileges are taken verbatim from the migration GRANTs (0007 + later);
# service_role is `all` on every table (trusted server). Absence of an authenticated privilege =
# server-only for that verb. RLS is ENABLE + FORCE on every table (verified: migrations 0007/0041).
# =============================================================================
