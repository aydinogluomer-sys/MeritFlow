# =============================================================================
# ENGINEERING-22 (§11) — role x table access-intent matrix. This is a DESIGN / audit record of the
# INTENDED read/write access per application role, derived from the RLS policies in the migrations.
# It is NOT enforced by CI (RLS correctness is proven by pgTAP + cross-tenant tests); it exists so an
# auditor / legal reviewer can see, at a glance, who is meant to read or write each surface.
#
# read  : true | false | own | masked
#   own    = only the caller's own rows (own organization_id + employee_id / recipient / complainant)
#   masked = comp only via read_compensation_record (masked summary; raw salary never exposed — AD3)
# write : true | false   (role-driven write capability via an RLS INSERT/UPDATE policy or a definer RPC;
#                          universal self-updates like editing one's own profile are noted, not a role power)
#
# Notes on non-obvious rows (verified against RLS):
#   - bonus_ledger / point_ledger / bonus_allocations / v_finance_*: Finance is VIEW-ONLY (SI-12) —
#     finance cannot raw-read allocations/point_ledger; bonus_ledger raw read is Finance + Auditor ONLY
#     (HR/employee excluded — migration 0014). Employees see their own bonus via bonus_allocations, not
#     the money ledger.
#   - compensation_records: employee read=false (D2); HR/Finance read=masked via read_compensation_record.
#   - rate_limit_counters: every application role false — server-only via check_rate_limit() (0041).
# trusted_server = service_role / SECURITY DEFINER context (full access); anon = unauthenticated (none).
# =============================================================================
